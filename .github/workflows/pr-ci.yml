name: PR CI

# Pull-request checks for the three code trees (core/, console/, gateway/) plus a
# repo-wide secret scan. Complements the tag-driven release workflows
# (switch-release.yml, switch-console-release.yml) — this file is the ongoing
# per-PR gate, they publish on tags.
#
# Fork safety: this uses `pull_request` (NOT `pull_request_target`), so runs
# triggered by fork PRs get a read-only GITHUB_TOKEN and NO access to repo
# secrets. Every job here only needs to read code, so that is exactly right —
# never switch this to pull_request_target.
#
# Path filtering: a `changes` job (dorny/paths-filter) detects which trees a PR
# touched; each tree's job is gated on its filter, so a backend-only PR skips
# the console/gateway jobs entirely. Shared files (workflows, root config) fan out
# to everything, since a change there can affect any tree. On a push to main
# every tree runs regardless: the filter resolves its base differently outside a
# PR, and a main run that quietly skipped the tree it should have checked would
# report the same green as one that verified it.
#
# Main is verified on push as well as per-PR, because a PR merged while red
# leaves main red with nothing to say so — the next branch to merge main
# inherits the failure and pays for it (CHOO-1430 reached main exactly this way).
#
# `actions/checkout` on a `pull_request` event checks out `refs/pull/<n>/merge`
# by default (verified against a real run's logs), GitHub's own preview of the
# PR merged into its base — so every job above already tests the merge result,
# not the branch tip, as of whenever it last ran. That "as of" is the gap:
# GitHub recomputes that preview as the base moves, but nothing re-runs the
# workflow just because it did, and merging is not gated on the branch being
# up to date. Two PRs chaining a migration off the same parent can each see a
# single head, go green, and sit open; if the first merges and the second
# never gets a new commit, its stale green check still satisfies the merge
# button, and only the merge of the second one actually produces two heads
# (CHOO-2689 — PRs #404 and #426, hand-fixed with merge revisions
# `b47e0c39a1f5` and `c81f4a06d2b7`). The `migration-heads-on-merge` job below
# re-tests every other open PR that touches migrations the moment a new one
# lands on main, so that race shows up as a red status on the affected PR
# immediately instead of at the next deploy.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, codex/tracemind-phase3-windows-native]

# Cancel a PR's in-flight CI when a new commit is pushed to the same ref.
#
# Push runs get the commit in their group, so they never cancel each other.
# Every merge to main shares one `github.ref`, so a single group would mean the
# next merge kills the previous merge's run — and `migration-heads-on-merge`
# only runs when the *triggering* commit touched migrations, so the run that
# replaces it skips the job entirely. Merge a migration and anything else a
# minute apart and no status is posted anywhere, silently, on exactly the busy
# day this is meant to cover.
concurrency:
  group: pr-ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed trees
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      console: ${{ steps.filter.outputs.console }}
      gateway: ${{ steps.filter.outputs.gateway }}
      artifacts: ${{ steps.filter.outputs.artifacts }}
      migrations: ${{ steps.filter.outputs.migrations }}
      chart: ${{ steps.filter.outputs.chart }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Filter paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            shared: &shared
              - '.github/workflows/pr-ci.yml'
              - 'ruff.toml'
              - 'justfile'
            backend:
              - *shared
              - 'core/**'
              # switch-core serves the dashboard's pages from a list that
              # core/tests holds equal to this file's routes, so a new page
              # here has to run them too.
              - 'gateway/src/App.tsx'
              # Tested from core/tests, so a change to it alone still runs them.
              - 'scripts/check_migration_heads_for_open_prs.py'
              - 'scripts/pin_chart_images.py'
              - 'scripts/prune_dev_packages.py'
              # The end-to-end coverage gate's snapshot of the server's surface,
              # checked against the server below.
              - 'scripts/e2e_surface.py'
              - 'console/tooling-e2e/surface/**'
            console:
              - *shared
              - 'console/**'
              # Switch Console bundles a generated copy of this file, and the job
              # below verifies the copy is current — so a change here has to
              # run the console job even though it lives outside console/.
              - 'deploy/local/standalone-docker-compose.yml'
            gateway:
              - *shared
              - 'gateway/**'
            # The server, the stack the fast lane stands up, and the harness.
            e2e:
              - *shared
              - 'core/**'
              - 'console/tooling-e2e/**'
              - 'console/pnpm-lock.yaml'
              - 'deploy/local/**'
              - '.env.example'
              - '.github/workflows/e2e.yml'
            # Its own filter, narrower than `backend`, so the push-triggered
            # `migration-heads-on-merge` job below only runs when it can
            # actually find a new head — not on every backend-touching push.
            migrations:
              - 'core/switch_core/migrations/versions/**'
            # The published Helm charts (switch, and the hosted controller's)
            # and what the release does to them before publishing (pins the
            # image digests into values.yaml).
            chart:
              - *shared
              - 'deploy/remote/helm/**'
              - 'deploy/hosted/chart/**'
              - 'deploy/hosted/render-check-values.yaml'
              - 'scripts/pin_chart_images.py'
              - '.github/workflows/switch-release.yml'
            # Spans every tree, so it gets its own filter rather than riding
            # any one of them. Includes the files whose versions the registry is
            # checked against, so a release bump cannot land without the check.
            artifacts:
              - *shared
              - 'artifacts.yaml'
              - 'scripts/gen_artifacts.py'
              - 'core/switch_core/artifacts.py'
              - 'core/pyproject.toml'
              - 'console/packages/shared/src/artifacts.ts'
              - 'console/packages/switch-agent-runtime/src/artifacts.ts'
              - 'console/apps/switch-console-desktop/package.json'
              - 'console/apps/switch-console-desktop/src/shared/app-identity*.ts'
              - 'console/packages/switch-agent-runtime/package.json'

  backend:
    name: Backend (core)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --project core

      - name: Ruff format check
        run: uv run --project core ruff format --check .

      - name: Ruff lint
        run: uv run --project core ruff check .

      - name: mypy
        run: uv run --project core mypy --config-file core/pyproject.toml core/switch_core/

      # The coverage gate in console/tooling-e2e reads this snapshot rather
      # than the server, so it has to be the server's: a route or operation
      # added without regenerating it fails here, and the regenerated snapshot
      # then fails the gate until a scenario or an exemption accounts for it.
      - name: E2E surface snapshot is current
        run: uv run --project core python scripts/e2e_surface.py --check

      # Store tests boot real Postgres via testcontainers; ubuntu-latest ships
      # Docker so the containers come up without extra setup. The slow
      # integration suite (Postgres + Tuwunel) is excluded from the default run
      # and is not part of PR CI.
      - name: pytest
        run: uv run --project core pytest -c core/pyproject.toml core/tests/

  console:
    name: Switch Console
    needs: changes
    if: ${{ needs.changes.outputs.console == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The desktop app's `browser` vitest project drives a real Chromium via
      # @vitest/browser-playwright, so the browser binary must be present.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The bundled compose is a generated copy of deploy/local's, and until now
      # nothing verified the sync had run — the two could drift with only a
      # comment asking nicely, which is how it silently stopped running once
      # already (CHOO-1865).
      #
      # The filter is the package name, not the directory. `pnpm --filter` on a
      # name nothing matches prints a notice and exits 0, so getting it wrong
      # does not fail the build — it just stops checking, which is how this
      # died the second time (the directory was renamed to
      # switch-console-desktop, the package is still @switch-console/desktop).
      - name: Bundled standalone compose is current
        run: pnpm --filter @switch-console/desktop run sync:compose:check

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' run build

      - name: Lint (oxlint)
        run: pnpm -r run lint

      - name: Format check (oxfmt)
        run: pnpm -r run format:check

      - name: Typecheck (tsgo)
        run: pnpm -r run typecheck

      # The Linux TraceMind isolation probe exercises bubblewrap's real
      # read-only filesystem, network, and PID namespaces.
      - name: Install bubblewrap for TraceMind isolation test
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Test delegated Linux cgroup v2 process and memory limits
        shell: bash
        env:
          TRACEMIND_REQUIRE_CGROUP: '1'
        run: |
          set -euo pipefail
          if ! grep -qw memory /sys/fs/cgroup/cgroup.subtree_control || ! grep -qw pids /sys/fs/cgroup/cgroup.subtree_control; then
            echo '::error::UNSUPPORTED: runner has no delegated cgroup v2 memory/pids controllers.'
            exit 1
          fi
          cgroup="/sys/fs/cgroup/tracemind-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            if [ -d "$cgroup" ]; then
              for child in "$cgroup"/*; do
                [ -d "$child" ] || continue
                if [ -w "$child/cgroup.kill" ]; then printf '1\n' > "$child/cgroup.kill" || true; fi
                for _ in $(seq 1 50); do
                  grep -q '^populated 0$' "$child/cgroup.events" && break
                  sleep 0.02
                done
                rmdir "$child" 2>/dev/null || true
              done
              rmdir "$cgroup" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          sudo mkdir "$cgroup"
          sudo chown "$(id -u):$(id -g)" "$cgroup"
          printf '+memory +pids\n' | sudo tee "$cgroup/cgroup.subtree_control" >/dev/null
          mkdir "$cgroup/worker"
          bash -c 'set -e; pid=$BASHPID; printf "%s\n" "$pid" | sudo tee "$1/worker/cgroup.procs" >/dev/null; shift; exec "$@"' _ "$cgroup" \
            pnpm --filter @switch-console/desktop exec vitest run --project node \
            src/main/core/tracemind/verification/linux-cgroup-v2.test.ts \
            src/main/core/tracemind/verification/linux-cgroup-v2.integration.test.ts

      - name: Test (vitest)
        run: pnpm -r run test

  console-macos-isolation:
    name: TraceMind sandbox (macOS)
    needs: changes
    if: ${{ needs.changes.outputs.console == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' run build

      - name: Test native macOS filesystem and network isolation
        run: >-
          pnpm --filter @switch-console/desktop exec vitest run --project node
          src/main/core/tracemind/verification/macos-sandbox.test.ts

      - name: Test trusted per-process CPU cap on macOS
        run: >-
          pnpm --filter @switch-console/desktop exec vitest run --project node
          src/main/core/tracemind/verification/process-adapter.test.ts
          -t 'trusted helper per-process CPU limit'

      - name: Fail closed for unsupported macOS resource limits
        run: >-
          pnpm --filter @switch-console/desktop exec vitest run --project node
          src/main/core/tracemind/verification/resource-limit-fail-closed.test.ts

      - name: Probe process-count and memory limit support on macOS
        run: >-
          pnpm --filter @switch-console/desktop exec vitest run --project node
          src/main/core/tracemind/verification/process-limit.test.ts
          src/main/core/tracemind/verification/memory-limit.test.ts

  # This lane probes actual Bubblewrap/cgroup controls in a disposable hosted
  # ARM64 VM's privileged job container. The outer runner remains ephemeral;
  # required isolation tests still fail closed if the kernel does not expose
  # the needed namespace or delegated cgroup controllers.
  console-linux-arm64-isolation:
    name: TraceMind sandbox (Linux ARM64)
    needs: changes
    if: ${{ github.event_name != 'pull_request' && (needs.changes.outputs.console == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:24.04
      options: --privileged --cgroupns=private
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install Linux build and isolation toolchain
        run: apt-get update && apt-get install -y build-essential bubblewrap python3 sudo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' run build

      - name: Assert hosted Linux ARM64 isolation prerequisites
        run: |
          test "$(uname -m)" = aarch64
          bwrap --version
          echo "LINUX_ARCH=$(uname -m)"
          echo "BUBBLEWRAP=$(bwrap --version)"

      - name: Test real Bubblewrap namespace isolation on ARM64
        run: >-
          pnpm --filter @switch-console/desktop exec vitest run --project node
          src/main/core/tracemind/verification/linux-bubblewrap-sandbox.test.ts
          src/main/core/tracemind/verification/linux-target-status.test.ts

      - name: Record hosted cgroup v2 capabilities
        run: |
          set -eu
          echo "UID=$(id -u) GID=$(id -g)"
          echo "CGROUP_INFO=$(cat /proc/self/cgroup | tr '\n' ';')"
          echo "CGROUP2_MOUNTS_BEGIN"
          grep ' - cgroup2 ' /proc/self/mountinfo || true
          echo "CGROUP2_MOUNTS_END"
          current="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          for path in /sys/fs/cgroup "/sys/fs/cgroup${current%/}"; do
            [ -d "$path" ] || continue
            echo "CGROUP_PATH=$path"
            for name in cgroup.controllers cgroup.subtree_control cgroup.type memory.max pids.max memory.oom.group; do
              file="$path/$name"
              if [ -r "$file" ]; then
                printf '%s=' "$name"
                tr '\n' ' ' < "$file"
                printf '\n'
              else
                echo "$name=<unreadable-or-absent>"
              fi
              if [ -w "$file" ]; then echo "${name}_writable=yes"; else echo "${name}_writable=no"; fi
            done
          done

      - name: Test required delegated cgroup v2 process and memory limits
        env:
          TRACEMIND_REQUIRE_CGROUP: '1'
        shell: bash
        run: |
          set -euo pipefail
          mount=/sys/fs/cgroup
          current="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          mount_fields="$(awk '$0 ~ / - cgroup2 / { print $4, $5; exit }' /proc/self/mountinfo)"
          read -r mount_root mount_point <<< "$mount_fields"
          if [[ "$current" != / || "$mount_root" != / || "$mount_point" != "$mount" ]]; then
            echo "::error::UNSUPPORTED: Expected a private cgroup-namespace root mounted at /sys/fs/cgroup; got current=$current root=$mount_root mount=$mount_point"
            exit 1
          fi
          available=" $(cat "$mount/cgroup.controllers") "
          for controller in memory pids; do
            if [[ "$available" != *" $controller "* ]]; then
              echo "::error::UNSUPPORTED: cgroup v2 controller $controller is unavailable."
              exit 1
            fi
          done
          parent="$mount/tracemind-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          parent_owned=0
          root_controls=" $(cat "$mount/cgroup.subtree_control") "
          root_to_enable=()
          root_to_disable=()
          root_changed=0
          for controller in memory pids; do
            if [[ "$root_controls" != *" $controller "* ]]; then
              root_to_enable+=("+$controller")
              root_to_disable+=("-$controller")
            fi
          done
          cleanup() {
            local status=$?
            local failed=0
            trap - EXIT
            set +e
            if [[ "$parent_owned" == 1 && -d "$parent" ]]; then
              if [[ -w "$parent/cgroup.kill" ]]; then printf '1\n' > "$parent/cgroup.kill"; else failed=1; fi
              for _ in $(seq 1 100); do
                grep -q '^populated 0$' "$parent/cgroup.events" && break
                sleep 0.02
              done
              grep -q '^populated 0$' "$parent/cgroup.events" || failed=1
              while IFS= read -r child; do rmdir "$child" 2>/dev/null || failed=1; done < <(find "$parent" -depth -mindepth 1 -type d)
              rmdir "$parent" 2>/dev/null || failed=1
            fi
            if [[ "$root_changed" == 1 && ${#root_to_disable[@]} -gt 0 ]]; then
              printf '%s' "${root_to_disable[*]}" > "$mount/cgroup.subtree_control" || failed=1
            fi
            if [[ "$failed" == 1 ]]; then
              echo '::error::TraceMind CI cgroup cleanup or controller restoration failed.'
              exit 1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          # The cgroup2 mount is the container's private namespace root, not the
          # host hierarchy. Build a run-owned, empty delegation parent before
          # moving the test process into a child so the no-internal-process rule
          # remains intact and TraceMind can create per-run limit groups beneath it.
          if [[ ${#root_to_enable[@]} -gt 0 ]]; then
            if ! printf '%s' "${root_to_enable[*]}" > "$mount/cgroup.subtree_control"; then
              echo '::error::UNSUPPORTED: cannot enable memory/pids in the private job cgroup namespace.'
              exit 1
            fi
            root_changed=1
          fi
          if ! mkdir "$parent"; then
            echo '::error::UNSUPPORTED: cannot create the unique TraceMind CI cgroup.'
            exit 1
          fi
          parent_owned=1
          if ! printf '+memory +pids\n' > "$parent/cgroup.subtree_control"; then
            echo '::error::UNSUPPORTED: cannot delegate memory/pids to the TraceMind CI cgroup.'
            exit 1
          fi
          mkdir "$parent/worker"
          printf '+memory +pids\n' > "$parent/worker/cgroup.subtree_control"
          mkdir "$parent/worker/runner"
          bash -c 'set -e; pid=$BASHPID; printf "%s\n" "$pid" > "$1/worker/runner/cgroup.procs"; shift; exec "$@"' _ "$parent" \
            pnpm --filter @switch-console/desktop exec vitest run --project node \
            src/main/core/tracemind/verification/linux-cgroup-v2.test.ts \
            src/main/core/tracemind/verification/linux-cgroup-v2.integration.test.ts

  # The agent runner and the controller on native Windows (CHOO-3472): process
  # control, CLI lookup and permissions there take different code paths, and
  # their tests that start real processes only run on Windows. Scoped to the
  # packages on that path; the rest of the desktop app's suite assumes POSIX.
  console-windows:
    name: Switch Console (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.console == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: console/.nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' run build

      # Each suite runs whatever the one before it did, so one run shows every failure.
      - name: Test shared
        run: pnpm --filter @switch-console/shared run test

      - name: Test agent-providers
        if: ${{ !cancelled() }}
        run: pnpm --filter @switch-console/agent-providers run test

      - name: Test agent-controller
        if: ${{ !cancelled() }}
        run: pnpm --filter @switch-console/agent-controller run test

      - name: Test Console's embedded controller and Windows launching
        if: ${{ !cancelled() }}
        run: pnpm --filter @switch-console/desktop exec vitest run --project node src/main/core/embedded-controller src/main/core/execution-context

      - name: Test TraceMind process adapter on Windows
        if: ${{ !cancelled() }}
        run: >-
          pnpm --filter @switch-console/desktop exec vitest run --project node
          src/main/core/tracemind/verification/process-adapter.test.ts
          src/main/core/tracemind/verification/command-contract.test.ts
          src/main/core/tracemind/verification/approval-service.test.ts
          src/main/core/tracemind/controller.test.ts
          src/main/core/tracemind/verification/resource-limit-fail-closed.test.ts

  console-windows-11-isolation:
    name: TraceMind sandbox (Windows 11 ARM64)
    needs: changes
    if: ${{ needs.changes.outputs.console == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    # Pin the VS 2026 ARM64 image: `windows-11-arm` migrates with the hosted
    # image rollout, while this label makes the ProcessContainer prerequisite
    # deterministic for the real MXC isolation lane.
    runs-on: windows-11-vs2026-arm
    defaults:
      run:
        shell: bash
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # MXC SDK 1.0.1 requires this Windows stdio-transfer floor; keep
          # Linux/macOS on the repository pin, but use the supported 24.x here.
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert Windows 11 ARM64 isolation prerequisites
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (process.platform !== 'win32' || process.arch !== 'arm64' || major !== 24 || minor < 21) process.exit(1); console.log('WINDOWS_PLATFORM=' + process.platform); console.log('WINDOWS_ARCH=' + process.arch); console.log('WINDOWS_NODE=' + process.versions.node)"

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' run build

      - name: Exercise real Windows ProcessContainer write and loopback denial
        env:
          TRACEMIND_REQUIRE_WINDOWS: '1'
        shell: pwsh
        run: >-
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:PATH";
          $whoami = Get-Command whoami.exe -CommandType Application | Select-Object -First 1;
          $expectedWhoami = Join-Path $env:SystemRoot 'System32\whoami.exe';
          Write-Output "WINDOWS_WHOAMI=$($whoami.Source)";
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId;
          Write-Output "WINDOWS_ACTION_SESSION_ID=$sessionId";
          Write-Output "WINDOWS_SESSION_NAME=$env:SESSIONNAME";
          if (-not $whoami -or $whoami.Source -ine $expectedWhoami) { throw "Unexpected whoami resolution: $($whoami.Source)" };
          pnpm --filter @switch-console/desktop exec vitest run --project node
          src/main/core/tracemind/native/native-loader.test.ts
          src/main/core/tracemind/native/windows-fs.integration.test.ts
          src/main/core/tracemind/verification/windows-mxc.test.ts
          src/main/core/tracemind/verification/windows-mxc.integration.test.ts
          src/main/core/tracemind/verification/resource-limit-fail-closed.test.ts

  artifacts:
    name: Artifact registry
    # Every artifact carries a compiled-in copy of artifacts.yaml, so the copies
    # can drift two ways: editing the source without regenerating, and
    # hand-editing a generated module. The same check compares the registry
    # against the version files packaging ecosystems own. It needs no formatter
    # or Node toolchain, which is why this is its own small job rather than a
    # step inside the backend or console trees.
    needs: changes
    if: ${{ needs.changes.outputs.artifacts == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --project core

      - name: Registry, generated modules and declared versions agree
        run: uv run --project core python scripts/gen_artifacts.py --check

  chart:
    name: Helm chart
    # The release pins every first-party image in the chart by digest before
    # publishing. This runs the same pin with placeholder digests and fails if
    # any first-party image still renders by tag, so an image value the pinner
    # does not know about fails here rather than shipping unpinned.
    needs: changes
    if: ${{ needs.changes.outputs.chart == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Every first-party image is pinned by digest once pinned
        # The release's own build step, with placeholder digests: pin, package,
        # lint, and verify each of the chart's check renders (for the switch
        # chart, defaults and the optional workloads on), so an image behind a
        # feature flag is checked too.
        run: |
          scripts/release_charts.sh build ghcr.io/render-check 0.0.0-check "$RUNNER_TEMP/chart" --placeholder-digests

  gateway:
    name: Gateway UI
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` runs `tsc -b && vite build`, so it doubles as the typecheck gate.
      - name: Build (tsc + vite)
        run: npm run build

      - name: Test (vitest)
        run: npm test

  # Real messages through a real server and Mattermost, on a stack the job
  # builds from this checkout. Needs no secret, so a fork PR runs it the same.
  # The provider lane is e2e-scheduled.yml's.
  e2e-fast:
    name: E2E fast lane
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/e2e.yml
    with:
      lane: fast
      agent_type: claude-code

  migration-heads-on-merge:
    name: Migration heads on merge
    # Only meaningful right after a new migration lands on main — a PR still
    # open at that moment is the one whose stale green check could let a
    # second head slip through (see the comment at the top of this file and
    # scripts/check_migration_heads_for_open_prs.py for the full story,
    # CHOO-2689). Reads revision files as plain text and never imports them
    # (see the script's own docstring for why), so it needs no database and no
    # Python environment for the project — cheap enough to run on every push
    # that touches the migrations directory.
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Re-check open PRs that touch migrations
        env:
          GH_TOKEN: ${{ github.token }}
          # gh takes the repository from its own environment, so the script
          # never assembles it into a command line.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/check_migration_heads_for_open_prs.py

  gitleaks:
    name: Secret scan (gitleaks)
    # Scans a PR's commit range, which only exists on a pull_request event: on a
    # push the base/head SHAs below are empty and the scan would cover nothing
    # while still reporting success. Every commit reaching main has been scanned
    # by its own PR.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so the PR commit range can be scanned.
          fetch-depth: 0

      # Invoke the gitleaks CLI directly via its Docker image. We deliberately
      # do NOT use gitleaks/gitleaks-action, which requires a paid license for
      # organization repos — the CLI itself is free under the same MIT license.
      - name: Scan PR commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect \
            --source=/repo \
            --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --verbose
